name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Linux only for now. Nothing below is Linux specific beyond the apt/xvfb steps,
    # so mac/windows jobs can be added as a matrix later.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Rust format, clippy, tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # The develop-gl WebGL parity tests run in headless Chromium (software GL via SwiftShader).
      - name: Install Playwright Chromium
        run: pnpm --filter @ee/develop-gl exec playwright install --with-deps chromium

      # Builds the native addon first (see root package.json), then runs vitest.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Screenshot (Electron under Xvfb)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
          pnpm screenshot

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
