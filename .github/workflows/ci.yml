name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      # Every e2e file must be named by a script a workflow runs, or it silently rots.
      - name: E2E coverage
        run: pnpm check:e2e-coverage

  rust:
    # Linux only. Windows has its own workflow (windows.yml) so it cannot slow or block these.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      # CC0 Nikon NEF samples used by the raw core tests (about 90 MB). The
      # cache key follows the fixture list, so changing it refetches.
      - uses: actions/cache@v6
        with:
          path: fixtures/raw
          key: fixtures-raw-${{ hashFiles('scripts/fetch-fixtures.ts') }}
      - run: node scripts/fetch-fixtures.ts
      - name: Rust format, clippy, tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

  native:
    # Built once and handed to the jobs that import @ee/core.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:native
      - uses: actions/upload-artifact@v7
        with:
          name: native-addon
          path: crates/core/*.node
          if-no-files-found: error
          retention-days: 1

  unit:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: native-addon
          path: crates/core
      - uses: actions/cache@v6
        with:
          path: fixtures/raw
          key: fixtures-raw-${{ hashFiles('scripts/fetch-fixtures.ts') }}
      - run: pnpm fetch-fixtures
      - uses: actions/cache@v6
        with:
          path: |
            fixtures/models
            fixtures/retouch
          key: fixtures-retouch-${{ hashFiles('scripts/fetch-retouch.ts') }}
      - run: pnpm fetch-retouch
      - name: Unit tests
        run: pnpm test:unit

  browser:
    # The develop-gl WebGL parity tests run in headless Chromium (SwiftShader).
    # No native addon needed, so this starts immediately instead of waiting for native.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm --filter @ee/develop-gl exec playwright install --with-deps chromium
      - name: WebGL parity tests
        run: pnpm test:browser

  # The demo, the export checks and the crop-overlay interactions each launch
  # their own app, so they run as three jobs instead of one long serial file
  # (CI bails on failure).
  e2e-demo:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: native-addon
          path: crates/core
      - uses: actions/cache@v6
        with:
          path: fixtures/raw
          key: fixtures-raw-${{ hashFiles('scripts/fetch-fixtures.ts') }}
      - run: pnpm fetch-fixtures
      - uses: actions/cache@v6
        with:
          path: |
            fixtures/models
            fixtures/retouch
          key: fixtures-retouch-${{ hashFiles('scripts/fetch-retouch.ts') }}
      - run: pnpm fetch-retouch
      # The Electron smoke test starts Xvfb itself when there is no display.
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
      # Electron downloads its binary on first use. Do that once, before any
      # test can launch it, so concurrent test files cannot race (ETXTBSY).
      - name: Install Electron binary
        run: node scripts/ensure-electron.mjs
      - name: Electron e2e (demo, real window and WebGL under Xvfb)
        run: xvfb-run -a --server-args='-screen 0 1920x1080x24' pnpm test:e2e:demo

  e2e-export:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: native-addon
          path: crates/core
      - uses: actions/cache@v6
        with:
          path: fixtures/raw
          key: fixtures-raw-${{ hashFiles('scripts/fetch-fixtures.ts') }}
      - run: pnpm fetch-fixtures
      - uses: actions/cache@v6
        with:
          path: |
            fixtures/models
            fixtures/retouch
          key: fixtures-retouch-${{ hashFiles('scripts/fetch-retouch.ts') }}
      - run: pnpm fetch-retouch
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Install Electron binary
        run: node scripts/ensure-electron.mjs
      - name: Electron e2e (exports at the preset size, under Xvfb)
        run: xvfb-run -a --server-args='-screen 0 1920x1080x24' pnpm test:e2e:export

  e2e-crop:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: native-addon
          path: crates/core
      - uses: actions/cache@v6
        with:
          path: fixtures/raw
          key: fixtures-raw-${{ hashFiles('scripts/fetch-fixtures.ts') }}
      - run: pnpm fetch-fixtures
      - uses: actions/cache@v6
        with:
          path: |
            fixtures/models
            fixtures/retouch
          key: fixtures-retouch-${{ hashFiles('scripts/fetch-retouch.ts') }}
      - run: pnpm fetch-retouch
      # The Electron smoke test starts Xvfb itself when there is no display.
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
      # Electron downloads its binary on first use. Do that once, before any
      # test can launch it, so concurrent test files cannot race (ETXTBSY).
      - name: Install Electron binary
        run: node scripts/ensure-electron.mjs
      - name: Electron e2e (crop overlay + smoke, under Xvfb)
        run: xvfb-run -a --server-args='-screen 0 1920x1080x24' pnpm test:e2e:crop

  # The zoom and Library e2e files each launch their own app and were previously only in the
  # local `test:e2e` script, so CI never ran them. They are split by the time one runner needs:
  # zoom/focused modes/delete/remove in one job, launch/filter/sidebars/Develop/cards in another.
  e2e-zoom:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: native-addon
          path: crates/core
      - uses: actions/cache@v6
        with:
          path: fixtures/raw
          key: fixtures-raw-${{ hashFiles('scripts/fetch-fixtures.ts') }}
      - run: pnpm fetch-fixtures
      - uses: actions/cache@v6
        with:
          path: |
            fixtures/models
            fixtures/retouch
          key: fixtures-retouch-${{ hashFiles('scripts/fetch-retouch.ts') }}
      - run: pnpm fetch-retouch
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Install Electron binary
        run: node scripts/ensure-electron.mjs
      - name: Electron e2e (zoom, focused modes, delete and remove from Library, under Xvfb)
        run: xvfb-run -a --server-args='-screen 0 1920x1080x24' pnpm test:e2e:zoom

  e2e-ui:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: native-addon
          path: crates/core
      - uses: actions/cache@v6
        with:
          path: fixtures/raw
          key: fixtures-raw-${{ hashFiles('scripts/fetch-fixtures.ts') }}
      - run: pnpm fetch-fixtures
      - uses: actions/cache@v6
        with:
          path: |
            fixtures/models
            fixtures/retouch
          key: fixtures-retouch-${{ hashFiles('scripts/fetch-retouch.ts') }}
      - run: pnpm fetch-retouch
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Install Electron binary
        run: node scripts/ensure-electron.mjs
      - name: Electron e2e (launch, filters, sidebars, Develop and cards, under Xvfb)
        run: xvfb-run -a --server-args='-screen 0 1920x1080x24' pnpm test:e2e:ui

  build-screenshots:
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: native-addon
          path: crates/core
      - uses: actions/cache@v6
        with:
          path: fixtures/raw
          key: fixtures-raw-${{ hashFiles('scripts/fetch-fixtures.ts') }}
      - run: pnpm fetch-fixtures
      - uses: actions/cache@v6
        with:
          path: |
            fixtures/models
            fixtures/retouch
          key: fixtures-retouch-${{ hashFiles('scripts/fetch-retouch.ts') }}
      - run: pnpm fetch-retouch
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth
      - name: Install Electron binary
        run: node scripts/ensure-electron.mjs
      - name: Build
        # The native addon came from the artifact; only the app is built here.
        run: pnpm --filter @ee/desktop run build
      - name: Screenshot (Electron under Xvfb)
        run: xvfb-run -a --server-args='-screen 0 1920x1080x24' node scripts/screenshot.ts
      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
