name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Linux only for now. Nothing below is Linux specific beyond the apt/xvfb steps,
    # so mac/windows jobs can be added as a matrix later.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # CC0 Nikon NEF samples used by the raw core tests (about 90 MB). The
      # cache key follows the fixture list, so changing it refetches.
      - uses: actions/cache@v6
        with:
          path: fixtures/raw
          key: fixtures-raw-${{ hashFiles('scripts/fetch-fixtures.ts') }}

      - run: pnpm fetch-fixtures

      # YuNet model and the public-domain face-detection photos. Small, but
      # cached so a PR does not depend on Wikimedia/GitHub availability.
      - uses: actions/cache@v6
        with:
          path: |
            fixtures/models
            fixtures/retouch
          key: fixtures-retouch-${{ hashFiles('scripts/fetch-retouch.ts') }}

      - run: pnpm fetch-retouch

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Rust format, clippy, tests
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
          cargo test

      # The develop-gl WebGL parity tests run in headless Chromium (software GL via SwiftShader).
      - name: Install Playwright Chromium
        run: pnpm --filter @ee/develop-gl exec playwright install --with-deps chromium

      # The Electron smoke test (apps/desktop) starts Xvfb itself when there is no display.
      - name: Install Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth

      # Builds the native addon first (see root package.json), then runs vitest.
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Screenshot (Electron under Xvfb)
        run: pnpm screenshot

      - uses: actions/upload-artifact@v7
        with:
          name: screenshots
          path: screenshots/
