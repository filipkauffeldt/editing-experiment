name: Windows

# Kept apart from ci.yml so a slow or broken Windows runner cannot hold up the Linux checks.
# Lint and typecheck are not repeated here: they read the same files on Linux.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'crates/**'
      - 'packages/ingest/**'
      - 'packages/contracts/**'
      - 'packages/metadata/**'
      - 'packages/export/**'
      - 'packages/retouch/**'
      - 'apps/desktop/src/main/**'
      - 'apps/desktop/src/jobs/**'
      - 'apps/desktop/package.json'
      - 'apps/desktop/electron-builder.yml'
      - 'apps/desktop/electron.vite.config.ts'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.gitattributes'
      - '.github/workflows/windows.yml'

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # What a developer on Windows does: install, build the native core, test, build the app, start it.
    # Every step after the install runs even when an earlier one failed, so one run shows everything
    # that is broken; the job is red until all of them pass.
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      # Link-time optimisation makes every release link slow. This job checks that things build and
      # work, and ships nothing, so it goes without.
      CARGO_PROFILE_RELEASE_LTO: 'off'
    steps:
      - uses: actions/checkout@v7
      # Version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # Cached even when the job fails, otherwise a red run leaves nothing behind and the next one
      # compiles LibRaw and every crate again.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - run: pnpm install --frozen-lockfile
      - name: Build the native core
        if: ${{ !cancelled() }}
        run: pnpm build:native
      # The Rust steps use --release like the native build, so the profile's artifacts (LibRaw, the
      # codecs) are compiled once and shared by the build, the tests and clippy.
      # One command per step: PowerShell only fails a step on the exit code of its last command.
      - uses: actions/cache@v6
        with:
          path: fixtures/raw
          key: fixtures-raw-${{ hashFiles('scripts/fetch-fixtures.ts') }}
      - name: Fetch fixtures
        if: ${{ !cancelled() }}
        run: node scripts/fetch-fixtures.ts
      - name: cargo test
        if: ${{ !cancelled() }}
        run: cargo test --release
      # Only clippy sees the cfg(windows) code in crates/core; Linux CI never compiles it.
      - name: cargo clippy
        if: ${{ !cancelled() }}
        run: cargo clippy --release --all-targets -- -D warnings
      - uses: actions/cache@v6
        with:
          path: |
            fixtures/models
            fixtures/retouch
          key: fixtures-retouch-${{ hashFiles('scripts/fetch-retouch.ts') }}
      - name: Fetch face detection fixtures
        if: ${{ !cancelled() }}
        run: pnpm fetch-retouch
      - name: Unit tests (ingest, export, metadata, retouch, core, jobs backend)
        if: ${{ !cancelled() }}
        run: pnpm test:unit:windows
      - name: Build the desktop app
        if: ${{ !cancelled() }}
        run: pnpm --filter "@ee/desktop" run build
      - name: Launch the built app
        if: ${{ !cancelled() }}
        run: pnpm test:e2e:launch
      # The main process, the instance lock, the window state and the log file. Maximising a window
      # needs a real desktop, which this runner has, so this is where that test runs.
      - name: Instance lock, window state and log file (pnpm test:e2e:lifecycle)
        if: ${{ !cancelled() }}
        run: pnpm test:e2e:lifecycle
      # The steps below take several minutes, so they run on main and by hand, not on PRs.
      # The installer: built, installed for this user without a prompt, and the installed app is
      # started by the same test the AppImage gets (a raw is ingested, previews are served, ExifTool
      # and the face model are used). The installer is kept as a workflow artifact.
      - name: Build the installer
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: pnpm dist:win --skip-native
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        with:
          name: windows-installer
          path: apps/desktop/release/*-setup.exe
          if-no-files-found: error
          retention-days: 7
      - name: Install the app for the current user
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          $setup = Get-ChildItem apps/desktop/release -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'no installer was built' }
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          # The installer hands over to a copy of itself, so Wait can return before the files are there.
          $programs = Join-Path $env:LOCALAPPDATA 'Programs'
          $exe = $null
          for ($i = 0; $i -lt 60 -and -not $exe; $i++) {
            $exe = Get-ChildItem $programs -Recurse -Depth 2 -Filter 'Editing Experiment.exe' -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            if (-not $exe) { Start-Sleep -Seconds 2 }
          }
          if (-not $exe) { throw "the installer did not put the app below $programs" }
          "installed at $exe"
          "EE_PACKAGED_APP=$exe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Launch the installed app (pnpm test:e2e:packaged)
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: pnpm test:e2e:packaged
      - name: Display size and scaling
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          Add-Type -AssemblyName System.Windows.Forms
          [System.Windows.Forms.Screen]::AllScreens | ForEach-Object { "$($_.DeviceName) $($_.Bounds) primary=$($_.Primary)" }
          Get-ItemProperty 'HKCU:\Control Panel\Desktop' -Name LogPixels -ErrorAction SilentlyContinue | Out-String
      # The real-mode smoke test ingests a NEF through the built app; the crop overlay test runs
      # beside it because both come from the existing script.
      - name: Real-mode smoke (pnpm test:e2e:crop)
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: pnpm test:e2e:crop
      # What a developer types: `pnpm dev` builds the native core, starts electron-vite and opens the
      # app. Give it three minutes (it rebuilds the native core first) to print that it started Electron and check Electron is running.
      - name: pnpm dev starts the app
        if: ${{ !cancelled() && github.event_name != 'pull_request' }}
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'dev.out.log'
          $err = Join-Path $env:RUNNER_TEMP 'dev.err.log'
          $dev = Start-Process -FilePath cmd.exe -ArgumentList '/c', 'pnpm dev' -RedirectStandardOutput $out -RedirectStandardError $err -PassThru
          $started = $false
          for ($i = 0; $i -lt 90 -and -not $started; $i++) {
            Start-Sleep -Seconds 2
            if ((Test-Path $out) -and (Select-String -Path $out -Pattern 'starting electron app' -Quiet)) { $started = $true }
            if ($dev.HasExited) { break }
          }
          Start-Sleep -Seconds 10
          $electron = @(Get-Process -Name electron -ErrorAction SilentlyContinue).Count
          Get-Content $out, $err -ErrorAction SilentlyContinue | Select-Object -Last 60
          taskkill /PID $dev.Id /T /F | Out-Null
          # taskkill fails when a child has just exited on its own, which is fine here.
          $global:LASTEXITCODE = 0
          if (-not $started) { throw 'pnpm dev never reached "starting electron app"' }
          if ($electron -eq 0) { throw 'pnpm dev started but no Electron process is running' }
