packages:
  - apps/*
  - packages/*
  - crates/*

# Only these dependencies may run install scripts. esbuild unpacks a platform
# binary. onnxruntime-node is deliberately denied: its postinstall fetches
# optional CUDA binaries, but the CPU runtime used here ships in the package.
# Electron has no install script: it downloads its binary on first use
# (`require('electron')`).
allowBuilds:
  esbuild: true
  onnxruntime-node: false

# pnpm refuses very fresh releases by default; electron 45.1.0 was pinned before
# the cool-down elapsed.
minimumReleaseAgeExclude:
  - electron@45.1.0
