packages:
  - apps/*
  - packages/*
  - crates/*

# Only these dependencies may run install scripts (electron downloads its binary,
# esbuild unpacks a platform binary); everything else stays blocked.
allowBuilds:
  electron: true
  esbuild: true

# pnpm refuses very fresh releases by default; electron 45.1.0 was pinned before
# the cool-down elapsed.
minimumReleaseAgeExclude:
  - electron@45.1.0
