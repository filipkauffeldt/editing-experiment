packages:
  - apps/*
  - packages/*
  - crates/*

# Only these dependencies may run install scripts (esbuild unpacks a platform
# binary); everything else stays blocked. Electron has no install script: it
# downloads its binary on first use (`require('electron')`).
allowBuilds:
  cpu-features: false
  dtrace-provider: false
  esbuild: true
  ssh2: false

# pnpm refuses very fresh releases by default; electron 45.1.0 was pinned before
# the cool-down elapsed.
minimumReleaseAgeExclude:
  - electron@45.1.0
